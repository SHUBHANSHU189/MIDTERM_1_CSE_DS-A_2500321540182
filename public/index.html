<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Product Inventory Management System</h1>

    <div class="container">

        <h2>Add Product</h2>

        <form id="productForm">

            <input
                type="number"
                id="id"
                placeholder="Product ID"
                required
            >

            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Product Price"
                min="0"
                step="0.01"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Product Category"
                required
            >

            <button type="submit" id="submitBtn">
                Add Product
            </button>

        </form>

        <h2>Product List</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productList">

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
